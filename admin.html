<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>eduhub 앱 관리</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header class="nav is-scrolled">
    <div class="nav__inner">
      <a href="index.html" class="brand" aria-label="eduhub 홈">
        <span class="brand__logo">
          <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M9 11h14M9 16h10M9 21h14" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>
        </span>
        <span class="brand__name">edu<b>hub</b> <small class="admin-tag">앱 관리</small></span>
      </a>
      <a class="admin-link" href="index.html">← 사이트로 돌아가기</a>
    </div>
  </header>

  <main class="admin">
    <section class="howto">
      <h1>앱 추가 · 수정 · 삭제</h1>
      <ol>
        <li>아래에서 앱을 추가하거나 고치세요. 바뀐 내용은 <b>이 브라우저에 자동 저장</b>되고, 사이트에서 바로 미리 볼 수 있어요.</li>
        <li>정리가 끝나면 <b>apps.js 내려받기</b>를 누르세요.</li>
        <li>내려받은 파일로 <code>eduhub/apps.js</code>를 바꿔 다시 배포하면 <b>모든 선생님</b>에게 반영됩니다.</li>
      </ol>
    </section>

    <div class="toolbar">
      <button class="btn" id="addBtn">＋ 새 앱 추가</button>
      <button class="btn btn--ghost" id="exportBtn">⬇ apps.js 내려받기</button>
      <label class="btn btn--ghost" for="importFile">⬆ 불러오기</label>
      <input type="file" id="importFile" accept=".js,.json" hidden />
      <button class="btn btn--danger" id="resetBtn">↺ 원래대로 되돌리기</button>
      <span class="status" id="status"></span>
    </div>

    <div class="owner">
      <label>기본 제작자 이름 <small>(새 앱의 제작자 칸에 자동 입력)</small>
        <input id="ownerInput" type="text" />
      </label>
    </div>

    <div class="table-wrap">
      <table class="list">
        <thead>
          <tr><th>순서</th><th>앱</th><th>분류</th><th>API 키</th><th>제작자</th><th>링크</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>

  <!-- 앱 편집 폼 -->
  <dialog class="modal modal--form" id="editor">
    <form id="form" method="dialog">
      <h2 id="formTitle">새 앱 추가</h2>
      <div class="fields">
        <label class="f-wide">앱 이름 *<input name="name" required /></label>
        <label>분류 *<select name="category" id="catSelect" required></select></label>
        <label>아이콘 (이모지)<input name="emoji" maxlength="4" placeholder="📝" /></label>
        <label class="f-wide">한 줄 설명 *<textarea name="desc" rows="3" required></textarea></label>
        <label class="f-wide">태그 <small>(쉼표로 구분)</small><input name="tags" placeholder="영어, 문항출제, 내신" /></label>
        <label>제작자<input name="author" /></label>
        <label>앱 주소 (URL)<input name="url" type="url" placeholder="https://....vercel.app" /></label>
        <label class="check"><input type="checkbox" name="needsKey" /> 🔑 Gemini API 키가 필요한 앱</label>
        <label class="check"><input type="checkbox" name="isNew" /> NEW 표시</label>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn--ghost" id="cancelBtn">취소</button>
        <button type="submit" class="btn" value="save">저장</button>
      </div>
    </form>
  </dialog>

  <script src="apps.js"></script>
  <script src="store.js"></script>
  <script src="admin.js"></script>
</body>
</html>
